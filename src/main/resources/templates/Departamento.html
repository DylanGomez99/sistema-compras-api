<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Departamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="d-flex">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- Contenido -->
    <div class="flex-grow-1">

        <!-- Navbar -->
        <div th:replace="~{fragments/navbar :: navbar('Gestión de Departamentos')}"></div>

        <main class="p-4">

            <!-- Formulario -->
            <div class="card shadow-sm mb-4">

                <div class="card-header bg-dark text-white">
                    Nuevo Departamento
                </div>

                <div class="card-body">

                    <form th:action="@{/departamento/guardar}"
                          th:object="${departamento}"
                          method="post">

                        <div class="row">

                            <div class="col-md-5">
                                <label class="form-label">Nombre</label>

                                <input
                                        type="text"
                                        class="form-control"
                                        th:field="*{nombre}"
                                        required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Estado</label>

                                <select
                                        class="form-select"
                                        th:field="*{estado}">

                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>

                                </select>
                            </div>

                            <div class="col-md-4 d-flex align-items-end">

                                <button
                                        class="btn btn-success w-100"
                                        type="submit">

                                    Guardar

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

            <!-- Tabla -->

            <div class="card shadow-sm">

                <div class="card-header">
                    Lista de Departamentos
                </div>

                <div class="card-body">

                    <table class="table table-striped table-hover">

                        <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="dep : ${departamentos}">

                            <td th:text="${dep.id}"></td>

                            <td th:text="${dep.nombre}"></td>

                            <td>

                                <span
                                        class="badge bg-success"
                                        th:if="${dep.estado}">

                                    Activo

                                </span>

                                <span
                                        class="badge bg-secondary"
                                        th:unless="${dep.estado}">

                                    Inactivo

                                </span>

                            </td>

                            <td>
                                <a th:href="@{/departamento/editar/{id}(id=${dep.id})}"
                                   class="btn btn-primary btn-sm">
                                    Editar
                                </a>

                                <a
                                        th:href="@{/departamento/eliminar/{id}(id=${dep.id})}"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm('¿Desea eliminar este departamento?')">

                                    Eliminar

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

</body>
</html>
