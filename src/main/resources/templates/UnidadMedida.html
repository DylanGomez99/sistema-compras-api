<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Unidad de Medida</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1">

        <div th:replace="~{fragments/navbar :: navbar('Gestión de Unidades de Medida')}"></div>

        <main class="p-4">

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    Nueva Unidad de Medida
                </div>

                <div class="card-body">
                    <form th:action="@{/unidadmedida/guardar}" th:object="${unidadMedida}" method="post">
                        <div class="row">

                            <div class="col-md-6">
                                <label class="form-label">Descripción</label>
                                <input class="form-control" th:field="*{descripcion}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>

                            <div class="col-md-3 d-flex align-items-end">
                                <button class="btn btn-success w-100" type="submit">
                                    Guardar
                                </button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header">
                    Lista de Unidades de Medida
                </div>

                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="unidad : ${unidadMedidas}">
                            <td th:text="${unidad.id}"></td>
                            <td th:text="${unidad.descripcion}"></td>

                            <td>
                                <span class="badge bg-success" th:if="${unidad.estado}">
                                    Activo
                                </span>

                                <span class="badge bg-secondary" th:unless="${unidad.estado}">
                                    Inactivo
                                </span>
                            </td>

                            <td>
                                <a class="btn btn-primary btn-sm"
                                   th:href="@{/unidadmedida/editar/{id}(id=${unidad.id})}">
                                    Editar
                                </a>

                                <a class="btn btn-danger btn-sm"
                                   th:href="@{/unidadmedida/eliminar/{id}(id=${unidad.id})}"
                                   onclick="return confirm('¿Desea eliminar esta unidad de medida?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                        </tbody>

                    </table>
                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
