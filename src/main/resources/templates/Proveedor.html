<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Proveedores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1">

        <div th:replace="~{fragments/navbar :: navbar('Gestión de Proveedores')}"></div>

        <main class="p-4">

            <div class="card shadow-sm mb-4">

                <div class="card-header bg-dark text-white">
                    Nuevo Proveedor
                </div>

                <div class="card-body">

                    <form th:action="@{/proveedor/guardar}"
                          th:object="${proveedor}"
                          method="post">

                        <div class="row">

                            <div class="col-md-3">
                                <label class="form-label">Nombre</label>
                                <input class="form-control"
                                       th:field="*{nombre}"
                                       required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Correo</label>
                                <input type="email"
                                       class="form-control"
                                       th:field="*{correo}"
                                       required>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Teléfono</label>
                                <input class="form-control"
                                       th:field="*{telefono}"
                                       required>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Estado</label>

                                <select class="form-select"
                                        th:field="*{estado}">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>

                            <div class="col-md-2 d-flex align-items-end">

                                <button class="btn btn-success w-100"
                                        type="submit">

                                    Guardar

                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

            <div class="card shadow-sm">

                <div class="card-header">
                    Lista de Proveedores
                </div>

                <div class="card-body">

                    <table class="table table-striped table-hover">

                        <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="prov : ${proveedores}">

                            <td th:text="${prov.id}"></td>

                            <td th:text="${prov.nombre}"></td>

                            <td th:text="${prov.correo}"></td>

                            <td th:text="${prov.telefono}"></td>

                            <td>

                                <span class="badge bg-success"
                                      th:if="${prov.estado}">
                                    Activo
                                </span>

                                <span class="badge bg-secondary"
                                      th:unless="${prov.estado}">
                                    Inactivo
                                </span>

                            </td>

                            <td>

                                <a class="btn btn-primary btn-sm"
                                   th:href="@{/proveedor/editar/{id}(id=${prov.id})}">
                                    Editar
                                </a>

                                <a class="btn btn-danger btn-sm"
                                   th:href="@{/proveedor/eliminar/{id}(id=${prov.id})}"
                                   onclick="return confirm('¿Desea eliminar este proveedor?')">

                                    Eliminar

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

</body>
</html>
