<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Artículos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1">

        <div th:replace="~{fragments/navbar :: navbar('Gestión de Artículos')}"></div>

        <main class="p-4">

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    Nuevo Artículo
                </div>

                <div class="card-body">
                    <form th:action="@{/articulo/guardar}" th:object="${articulo}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="row">

                            <div class="col-md-3">
                                <label class="form-label">Descripción</label>
                                <input class="form-control" th:field="*{descripcion}" required>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Marca</label>
                                <input class="form-control" th:field="*{marca}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Unidad de Medida</label>
                                <select class="form-select" th:field="*{unidadMedida.id}" required>
                                    <option value="">Seleccione...</option>
                                    <option th:each="unidad : ${unidades}"
                                            th:value="${unidad.id}"
                                            th:text="${unidad.descripcion}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Existencia</label>
                                <input type="number" min="0" class="form-control" th:field="*{existencia}" required>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>

                        </div>

                        <div class="mt-3">
                            <button class="btn btn-success" type="submit">Guardar</button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header">
                    Lista de Artículos
                </div>

                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Descripción</th>
                            <th>Marca</th>
                            <th>Unidad</th>
                            <th>Existencia</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="art : ${articulos}">
                            <td th:text="${art.id}"></td>
                            <td th:text="${art.descripcion}"></td>
                            <td th:text="${art.marca}"></td>
                            <td th:text="${art.unidadMedida != null ? art.unidadMedida.descripcion : 'Sin unidad'}"></td>
                            <td th:text="${art.existencia}"></td>

                            <td>
                                <span class="badge bg-success" th:if="${art.estado}">Activo</span>
                                <span class="badge bg-secondary" th:unless="${art.estado}">Inactivo</span>
                            </td>

                            <td>
                                <a class="btn btn-primary btn-sm"
                                   th:href="@{/articulo/editar/{id}(id=${art.id})}">
                                    Editar
                                </a>

                                <a class="btn btn-danger btn-sm"
                                   th:href="@{/articulo/eliminar/{id}(id=${art.id})}"
                                   onclick="return confirm('¿Desea eliminar este artículo?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                        </tbody>

                    </table>
                </div>
            </div>

        </main>

    </div>

</div>

</body>
</html>
