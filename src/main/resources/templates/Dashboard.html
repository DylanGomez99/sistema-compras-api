<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Compras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1">

        <main class="p-4">
            <h2>Bienvenido al Sistema de Compras</h2>

                            <h5>Departamentos</h5>
                            <h2>0</h2>

                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm">

                            <h2>0</h2>

                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5>Artículos</h5>
                            <h2>0</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5>Órdenes</h5>
