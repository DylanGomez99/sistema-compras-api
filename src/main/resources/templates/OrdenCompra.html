<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Orden de Compra</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-grow-1">
        <div th:replace="~{fragments/navbar :: navbar('Gestión de Órdenes de Compra')}"></div>

        <main class="p-4">

            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    Nueva Orden de Compra
                </div>

                <div class="card-body">
                    <form th:action="@{/ordencompra/guardar}" th:object="${ordenCompra}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label class="form-label">Número de Orden</label>
                                <input class="form-control" th:field="*{numeroOrden}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Fecha Orden</label>
                                <input type="date" class="form-control" th:field="*{fechaOrden}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Estado</label>
                                <select class="form-select" th:field="*{estado}">
                                    <option value="true">Activa</option>
                                    <option value="false">Inactiva</option>
                                </select>
                            </div>
                        </div>

                        <hr>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Artículo</label>
                                <select class="form-select" th:field="*{articulo.id}" required>
                                    <option value="">Seleccione...</option>
                                    <option th:each="articulo : ${articulos}"
                                            th:value="${articulo.id}"
                                            th:text="${articulo.descripcion}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Unidad de Medida</label>
                                <select class="form-select" th:field="*{unidadMedida.id}" required>
                                    <option value="">Seleccione...</option>
                                    <option th:each="unidad : ${unidades}"
                                            th:value="${unidad.id}"
                                            th:text="${unidad.descripcion}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Cantidad</label>
                                <input type="number" min="1" class="form-control" th:field="*{cantidad}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Costo Unitario</label>
                                <input type="number" step="0.01" min="0" class="form-control" th:field="*{costoUnitario}" required>
                            </div>
                        </div>

                        <button class="btn btn-success" type="submit">
                            Guardar Orden
                        </button>

                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header">
                    Lista de Órdenes de Compra
                </div>

                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Número</th>
                            <th>Fecha</th>
                            <th>Artículo</th>
                            <th>Unidad</th>
                            <th>Cantidad</th>
                            <th>Costo Unitario</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="orden : ${ordenes}">
                            <td th:text="${orden.id}"></td>
                            <td th:text="${orden.numeroOrden}"></td>
                            <td th:text="${orden.fechaOrden}"></td>
                            <td th:text="${orden.articulo != null ? orden.articulo.descripcion : 'Sin artículo'}"></td>
                            <td th:text="${orden.unidadMedida != null ? orden.unidadMedida.descripcion : 'Sin unidad'}"></td>
                            <td th:text="${orden.cantidad}"></td>
                            <td th:text="${orden.costoUnitario}"></td>
                            <td th:text="${orden.cantidad != null && orden.costoUnitario != null ? orden.cantidad * orden.costoUnitario : 0}"></td>

                            <td>
                                <span class="badge bg-success" th:if="${orden.estado}">Activa</span>
                                <span class="badge bg-secondary" th:unless="${orden.estado}">Inactiva</span>
                            </td>

                            <td>
                                <a class="btn btn-primary btn-sm"
                                   th:href="@{/ordencompra/editar/{id}(id=${orden.id})}">
                                    Editar
                                </a>

                                <a class="btn btn-danger btn-sm"
                                   th:href="@{/ordencompra/eliminar/{id}(id=${orden.id})}"
                                   onclick="return confirm('¿Desea eliminar esta orden?')">
                                    Eliminar
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>
</div>

</body>
</html>
